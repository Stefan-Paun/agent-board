version: 2
updates:
  # Agent-Board hat keine npm-Abhaengigkeiten; Dependabot haelt die gepinnten Actions aktuell
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init und analyze muessen dieselbe Version haben, sonst bricht CodeQL ab
      codeql-action:
        patterns:
          - "github/codeql-action*"
